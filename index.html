<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Makro Tracker Pro</title>

  <!-- iOS PWA Konfiguration -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Makro Pro">

  <style>
    :root {
      --bg-color: #f4f6fb;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #3b82f6;
      --protein-color: #60a5fa;
      --carbs-color: #fbbf24;
      --fat-color: #a78bfa;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-soft: 0 10px 25px -5px rgba(15, 23, 42, 0.06), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      margin: 0;
      padding: env(safe-area-inset-top, 24px) 16px env(safe-area-inset-bottom, 40px) 16px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
      line-height: 1.4;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0 16px 0;
    }

    .app-title {
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0;
      background: linear-gradient(135deg, #0f172a, #3b82f6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .app-badge {
      font-size: 0.75rem;
      font-weight: 700;
      background: #dbeafe;
      color: #1e40af;
      padding: 4px 10px;
      border-radius: 20px;
    }

    .segmented-control {
      display: flex;
      background-color: #e2e8f0;
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 18px;
      gap: 4px;
    }

    .segment-btn {
      flex: 1;
      padding: 10px 0;
      border: none;
      background: transparent;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .segment-btn.active {
      background: var(--card-bg);
      color: var(--text-main);
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }

    .hero-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      color: #ffffff;
      border-radius: var(--radius-lg);
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 12px 24px -6px rgba(15, 23, 42, 0.25);
    }

    .hero-top {
      text-align: center;
      margin-bottom: 16px;
    }

    .hero-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #94a3b8;
      font-weight: 700;
    }

    .hero-kcal {
      font-size: 2.5rem;
      font-weight: 800;
      line-height: 1.1;
      margin-top: 4px;
    }

    .hero-kcal span {
      font-size: 1.1rem;
      font-weight: 600;
      color: #94a3b8;
    }

    .split-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 99px;
      overflow: hidden;
      display: flex;
      margin-bottom: 18px;
    }

    .split-segment {
      height: 100%;
      transition: width 0.4s ease;
    }

    .macro-dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .macro-stat-box {
      background: rgba(255, 255, 255, 0.07);
      padding: 12px;
      border-radius: 12px;
      text-align: center;
      backdrop-filter: blur(5px);
    }

    .macro-stat-title {
      font-size: 0.75rem;
      color: #cbd5e1;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .macro-stat-val {
      font-size: 1.2rem;
      font-weight: 800;
      margin-top: 4px;
    }

    .macro-stat-pct {
      font-size: 0.72rem;
      color: #94a3b8;
      font-weight: 600;
      margin-top: 2px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    .card-header {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: var(--text-main);
    }

    label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 700;
      display: block;
      margin-bottom: 5px;
    }

    input, select {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid #e2e8f0;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      margin-bottom: 12px;
      background-color: #f8fafc;
      color: var(--text-main);
      font-weight: 500;
      transition: border-color 0.2s, background-color 0.2s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary);
      background-color: #ffffff;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
    }

    /* Søgeboks med live dropdown */
    .preset-box {
      background: linear-gradient(180deg, #f0f7ff 0%, #e0effe 100%);
      border: 1px solid #bae6fd;
      padding: 14px;
      border-radius: 14px;
      margin-bottom: 16px;
      position: relative;
    }

    .search-wrapper {
      position: relative;
      margin-bottom: 12px;
    }

    /* Live dropdown liste */
    .search-results-dropdown {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      max-height: 200px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      display: none;
    }

    .search-result-item {
      padding: 10px 12px;
      font-size: 0.9rem;
      border-bottom: 1px solid #f1f5f9;
      cursor: pointer;
      color: #1e293b;
    }

    .search-result-item:hover, .search-result-item:active {
      background-color: #eff6ff;
      color: #1d4ed8;
    }

    .unit-row {
      display: grid;
      grid-template-columns: 1fr 1.3fr;
      gap: 10px;
    }

    .input-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .helper-text {
      font-size: 0.78rem;
      color: #0369a1;
      font-weight: 600;
      margin-top: 4px;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
      transition: transform 0.1s ease;
      margin-top: 4px;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .meal-list-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .meal-item-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
    }

    .meal-info {
      flex: 1;
      padding-right: 10px;
    }

    .meal-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .meal-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .badge-p { background: #dbeafe; color: #1d4ed8; }
    .badge-c { background: #fef3c7; color: #b45309; }
    .badge-f { background: #ede9fe; color: #6d28d9; }

    .meal-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .meal-kcal {
      text-align: right;
      font-weight: 800;
      font-size: 1rem;
      color: var(--text-main);
      min-width: 55px;
    }

    .meal-kcal span {
      display: block;
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .btn-delete {
      background-color: #fee2e2;
      color: #dc2626;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 800;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .empty-state {
      text-align: center;
      padding: 24px 12px;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <!-- 1. TOP HEADER -->
  <div class="app-header">
    <h1 class="app-title">MakroTracker</h1>
    <span class="app-badge">4-Dages Projekt</span>
  </div>

  <!-- 2. VÆLG DAG (1-4) -->
  <div class="segmented-control">
    <button class="segment-btn active" onclick="setDay(1)">Dag 1</button>
    <button class="segment-btn" onclick="setDay(2)">Dag 2</button>
    <button class="segment-btn" onclick="setDay(3)">Dag 3</button>
    <button class="segment-btn" onclick="setDay(4)">Dag 4</button>
  </div>

  <!-- 3. DASHBOARD -->
  <div class="hero-card">
    <div class="hero-top">
      <div class="hero-label" id="dashboardDayLabel">DAG 1 — SAMLET INDTAG</div>
      <div class="hero-kcal" id="totalKcalDisplay">0 <span>kcal</span></div>
    </div>

    <div class="split-bar-container">
      <div class="split-segment" id="pSplitBar" style="background: var(--protein-color); width: 33.3%;"></div>
      <div class="split-segment" id="cSplitBar" style="background: var(--carbs-color); width: 33.3%;"></div>
      <div class="split-segment" id="fSplitBar" style="background: var(--fat-color); width: 33.4%;"></div>
    </div>

    <div class="macro-dashboard-grid">
      <div class="macro-stat-box">
        <div class="macro-stat-title"><span class="dot" style="background: var(--protein-color);"></span>Protein</div>
        <div class="macro-stat-val" id="totalPDisplay">0g</div>
        <div class="macro-stat-pct" id="pPctDisplay">0%</div>
      </div>
      <div class="macro-stat-box">
        <div class="macro-stat-title"><span class="dot" style="background: var(--carbs-color);"></span>Kulhydrat</div>
        <div class="macro-stat-val" id="totalCDisplay">0g</div>
        <div class="macro-stat-pct" id="cPctDisplay">0%</div>
      </div>
      <div class="macro-stat-box">
        <div class="macro-stat-title"><span class="dot" style="background: var(--fat-color);"></span>Fedt</div>
        <div class="macro-stat-val" id="totalFDisplay">0g</div>
        <div class="macro-stat-pct" id="fPctDisplay">0%</div>
      </div>
    </div>
  </div>

  <!-- 4. REGISTRERING -->
  <div class="card">
    <div class="card-header">
      <span id="sectionTitle">Tilføj måltid til Dag 1</span>
    </div>
    
    <!-- Live søgeboks -->
    <div class="preset-box">
      <label for="searchFood">🔍 Søg i fødevaredatabasen (500 varer)</label>
      <div class="search-wrapper">
        <input type="text" id="searchFood" placeholder="Skriv fx 'kylling' eller 'æg'..." autocomplete="off" oninput="onSearchInput()">
        <div id="searchResults" class="search-results-dropdown"></div>
      </div>

      <div class="unit-row">
        <div>
          <label for="foodAmount" id="amountLabel">Mængde</label>
          <input type="number" id="foodAmount" value="1" min="0.1" step="0.1" oninput="calculateFromPreset()">
        </div>
        <div>
          <label for="foodUnit">Enhed</label>
          <select id="foodUnit" onchange="onUnitChanged()">
            <option value="stk" id="unitStkOption">Stk / Portion</option>
            <option value="g">Gram (g)</option>
          </select>
        </div>
      </div>

      <div class="helper-text" id="weightHelper">
        Søg og tryk på en madvare ovenfor for at vælge den.
      </div>
    </div>

    <!-- Formular -->
    <form id="foodEntryForm">
      <label for="itemName">Måltidets navn</label>
      <input type="text" id="itemName" placeholder="Vælg en vare eller skriv manuelt" required>

      <div class="input-row">
        <div>
          <label for="itemProtein">Protein (g)</label>
          <input type="number" id="itemProtein" step="0.1" min="0" placeholder="0" required>
        </div>
        <div>
          <label for="itemCarbs">Kulhydrat (g)</label>
          <input type="number" id="itemCarbs" step="0.1" min="0" placeholder="0" required>
        </div>
        <div>
          <label for="itemFat">Fedt (g)</label>
          <input type="number" id="itemFat" step="0.1" min="0" placeholder="0" required>
        </div>
      </div>

      <button type="submit" class="btn-submit">+ Tilføj til dagens log</button>
    </form>
  </div>

  <!-- 5. LISTE -->
  <div class="card">
    <div class="card-header">
      <span>Dagens måltider</span>
      <span id="mealCountBadge" style="font-size: 0.8rem; color: var(--text-muted); font-weight: 600;">0 måltider</span>
    </div>

    <div id="entriesList" class="meal-list-container"></div>
  </div>

    const foodDatabase = [];
    for (const category in RAW_FOODS) {
      RAW_FOODS[category].forEach(item => {
        foodDatabase.push({
          category: category,
          name: item[0],
          p: item[1],
          c: item[2],
          f: item[3],
          pieceWeight: item[4],
          pieceName: item[5]
        });
      });
    }

    let activeDay = 1;
    let selectedFoodIndex = null;
    const storageKey = 'github_pages_macro_app';

    let data = JSON.parse(localStorage.getItem(storageKey)) || {
      1: [],
      2: [],
      3: [],
      4: []
    };

    // Live søgning der viser resultater lige nedenunder
    function onSearchInput() {
      const query = document.getElementById('searchFood').value.toLowerCase().trim();
      const dropdown = document.getElementById('searchResults');
      dropdown.innerHTML = '';

      if (query.length === 0) {
        dropdown.style.display = 'none';
        selectedFoodIndex = null;
        return;
      }

      const matches = [];
      foodDatabase.forEach((food, index) => {
        if (food.name.toLowerCase().includes(query)) {
          matches.push({ ...food, index });
        }
      });

      if (matches.length === 0) {
        dropdown.style.display = 'none';
        return;
      }

      // Vis op til 15 resultater for ikke at overvælde skærmen
      matches.slice(0, 15).forEach(item => {
        const div = document.createElement('div');
        div.className = 'search-result-item';
        div.innerHTML = `<strong>${item.name}</strong> <span style="color:#64748b; font-size:0.8rem;">(${item.category})</span>`;
        div.onclick = function() {
          selectFoodItem(item.index);
        };
        dropdown.appendChild(div);
      });

      dropdown.style.display = 'block';
    }

    // Når brugeren klikker på en madvare i dropdown-listen
    function selectFoodItem(index) {
      selectedFoodIndex = index;
      const food = foodDatabase[index];

      document.getElementById('searchFood').value = food.name;
      document.getElementById('searchResults').style.display = 'none';

      const unitStkOption = document.getElementById('unitStkOption');
      unitStkOption.textContent = `Stk / ${food.pieceName} (${food.pieceWeight}g)`;

      const unitSelect = document.getElementById('foodUnit');
      const amountEl = document.getElementById('foodAmount');

      if (unitSelect.value === "stk") {
        amountEl.value = 1;
        amountEl.step = "0.5";
      } else {
        amountEl.value = 100;
        amountEl.step = "10";
      }

      calculateFromPreset();
    }

    function onUnitChanged() {
      const unit = document.getElementById('foodUnit').value;
      const amountEl = document.getElementById('foodAmount');
      const amountLabel = document.getElementById('amountLabel');

      if (unit === "stk") {
        amountLabel.textContent = "Antal (stk)";
        amountEl.value = 1;
        amountEl.step = "0.5";
      } else {
        amountLabel.textContent = "Vægt (gram)";
        amountEl.value = 100;
        amountEl.step = "10";
      }

      calculateFromPreset();
    }

    function calculateFromPreset() {
      if (selectedFoodIndex === null) return;

      const food = foodDatabase[selectedFoodIndex];
      const amount = parseFloat(document.getElementById('foodAmount').value) || 0;
      const unit = document.getElementById('foodUnit').value;
      const helperEl = document.getElementById('weightHelper');

      let totalGrams = 0;
      let displayTitle = "";

      if (unit === "stk") {
        totalGrams = Math.round(amount * food.pieceWeight);
        displayTitle = `${amount} ${food.pieceName} ${food.name} (${totalGrams}g)`;
        helperEl.textContent = `⚡ Svarer til ${totalGrams} gram i alt.`;
      } else {
        totalGrams = Math.round(amount);
        displayTitle = `${food.name} (${totalGrams}g)`;
        helperEl.textContent = `⚡ Beregnet for ${totalGrams} gram.`;
      }

      const ratio = totalGrams / 100;

      document.getElementById('itemName').value = displayTitle;
      document.getElementById('itemProtein').value = (food.p * ratio).toFixed(1);
      document.getElementById('itemCarbs').value = (food.c * ratio).toFixed(1);
      document.getElementById('itemFat').value = (food.f * ratio).toFixed(1);
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify(data));
    }

    function setDay(day) {
      activeDay = day;
      document.querySelectorAll('.segment-btn').forEach((btn, index) => {
        btn.classList.toggle('active', (index + 1) === day);
      });
      document.getElementById('sectionTitle').innerText = `Tilføj måltid til Dag ${day}`;
      document.getElementById('dashboardDayLabel').innerText = `DAG ${day} — SAMLET INDTAG`;
      render();
    }

    document.getElementById('foodEntryForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const name = document.getElementById('itemName').value;
      const protein = parseFloat(document.getElementById('itemProtein').value) || 0;
      const carbs = parseFloat(document.getElementById('itemCarbs').value) || 0;
      const fat = parseFloat(document.getElementById('itemFat').value) || 0;

      const calories = Math.round((protein * 4) + (carbs * 4) + (fat * 9));

      data[activeDay].push({
        id: Date.now(),
        name,
        protein,
        carbs,
        fat,
        calories
      });

      saveState();
      render();

      this.reset();
      document.getElementById('searchFood').value = "";
      selectedFoodIndex = null;
      document.getElementById('weightHelper').textContent = "✅ Måltid tilføjet til dagens log!";
    });

    function deleteItem(id) {
      data[activeDay] = data[activeDay].filter(item => item.id !== id);
      saveState();
      render();
    }

    function render() {
      const listContainer = document.getElementById('entriesList');
      listContainer.innerHTML = '';

      let totalP = 0, totalC = 0, totalF = 0, totalKcal = 0;
      const meals = data[activeDay];

      document.getElementById('mealCountBadge').textContent = `${meals.length} ${meals.length === 1 ? 'måltid' : 'måltider'}`;

      if (meals.length === 0) {
        listContainer.innerHTML = `<div class="empty-state">Ingen måltider registreret på Dag ${activeDay} endnu.<br>Brug søgefeltet ovenfor til at tilføje mad.</div>`;
      } else {
        meals.forEach(item => {
          totalP += item.protein;
          totalC += item.carbs;
          totalF += item.fat;
          totalKcal += item.calories;

          const card = document.createElement('div');
          card.className = 'meal-item-card';
          card.innerHTML = `
            <div class="meal-info">
              <div class="meal-title">${item.name}</div>
              <div class="meal-badges">
                <span class="badge badge-p">P: ${item.protein}g</span>
                <span class="badge badge-c">K: ${item.carbs}g</span>
                <span class="badge badge-f">F: ${item.fat}g</span>
              </div>
            </div>
            <div class="meal-right">
              <div class="meal-kcal">${item.calories} <span>kcal</span></div>
              <button class="btn-delete" onclick="deleteItem(${item.id})" title="Slet">✕</button>
            </div>
          `;
          listContainer.appendChild(card);
        });
      }

      document.getElementById('totalKcalDisplay').innerHTML = `${totalKcal} <span>kcal</span>`;
      document.getElementById('totalPDisplay').textContent = `${totalP.toFixed(1)}g`;
      document.getElementById('totalCDisplay').textContent = `${totalC.toFixed(1)}g`;
      document.getElementById('totalFDisplay').textContent = `${totalF.toFixed(1)}g`;

      const totalMacroGrams = totalP + totalC + totalF;
      let pPct = 0, cPct = 0, fPct = 0;

      if (totalMacroGrams > 0) {
        pPct = Math.round((totalP / totalMacroGrams) * 100);
        cPct = Math.round((totalC / totalMacroGrams) * 100);
        fPct = 100 - pPct - cPct;
      }

      document.getElementById('pPctDisplay').textContent = `${pPct}%`;
      document.getElementById('cPctDisplay').textContent = `${cPct}%`;
      document.getElementById('fPctDisplay').textContent = `${fPct}%`;

      if (totalMacroGrams === 0) {
        document.getElementById('pSplitBar').style.width = '33.3%';
        document.getElementById('cSplitBar').style.width = '33.3%';
        document.getElementById('fSplitBar').style.width = '33.4%';
      } else {
        document.getElementById('pSplitBar').style.width = `${pPct}%`;
        document.getElementById('cSplitBar').style.width = `${cPct}%`;
        document.getElementById('fSplitBar').style.width = `${fPct}%`;
      }
    }

    render();
  </script>
</body>
</html>
